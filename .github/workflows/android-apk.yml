name: Build CLIPFORGE Android APK

on:
  workflow_dispatch:
  push:
    branches: [v2.9-android-apk]
    paths: ['android/**', '.github/workflows/android-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLIPFORGE-AI-2.9.0-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
